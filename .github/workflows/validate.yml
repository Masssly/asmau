name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check games, narration, translations, references and offline list
        # a pull request (a translation, say) need not rebuild the offline lists: the next release does
        run: node scripts/validate.js ${{ github.event_name == 'pull_request' && '--pull-request' || '' }}

  tests:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the test tools
        working-directory: tests
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Play the game, check offline, narration, sync and updates
        working-directory: tests
        run: npm test
