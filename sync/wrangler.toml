# Cloudflare Worker for the optional "keep my recordings on all my devices" feature.
# Deploy:  cd sync && npx wrangler deploy
name = "asmau-sync"
main = "worker.js"
compatibility_date = "2026-11-01"

[[r2_buckets]]
binding = "CLIPS"
bucket_name = "asmau"

# a year of silence deletes a family's recordings; this runs the check every day
[triggers]
crons = ["17 3 * * *"]

# request limits (per 60 seconds): one family code, and one network address
[[ratelimits]]
name = "PER_FAMILY"
namespace_id = "7101"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "PER_IP"
namespace_id = "7102"
simple = { limit = 300, period = 60 }
